<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unavailable</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --surface:#fff; --text:#16191d; --muted:#5d6673; --border:#e3e6ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --surface:#191d23; --text:#eef1f5; --muted:#9aa5b3; --border:#2a3038; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  .box { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px 24px;
         max-width:420px; text-align:center; }
  h1 { font-size:1.125rem; margin:0 0 8px; }
  p { color:var(--muted); margin:0; }
</style>
</head>
<body>
<div class="box">
  <h1>This dashboard is not available</h1>
  <p>{{message}}</p>
</div>
</body>
</html>
