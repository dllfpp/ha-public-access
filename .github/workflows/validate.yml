name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # The license check requires an OSI-approved licence. This project is
          # deliberately source-available (PolyForm Shield 1.0.0), which no OSI
          # licence can express, so that check can never pass and is skipped.
          # Distribution is via HACS custom repository, which runs no validation;
          # every other check here still has to pass.
          ignore: license

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest tests -q
